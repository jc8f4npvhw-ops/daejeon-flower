      "body": "무화과나무의 친척인 상록수\n인도고무나무의 학명은 Ficus elastica이며 뽕나무과에 속해요. 무화과와 같은 속이지만 집에서는 열매보다 넓고 윤기 있는 잎을 주로 감상해요. 자연에서는 큰 나무로 자라며 실내에서는 빛과 화분의 뿌리 공간, 가지 관리에 따라 크기가 달라져요. 어린 개체는 곧은 축을 중심으로 자라는 모습이 눈에 띄어요. 작은 화분에서도 나무다운 줄기와 큰 잎이 만드는 비율을 즐길 수 있는 식물이에요.\n\n하얀 유액과 이름의 관계\n식물 조직이 상하면 하얀 유액이 나오는 특징이 있어요. elastica라는 종명과 고무나무라는 이름은 고무 원료로 이용되던 유액과 관련이 있어요. 이름이 친숙하더라도 유액을 생활 속 재료처럼 만지거나 이용하지는 마세요. 가지를 자르거나 상한 잎을 정리할 때에는 장갑을 쓰고 피부나 눈에 닿지 않도록 해요. 반려동물과 어린이가 잎을 씹지 않는 위치에 두고 작업 뒤에는 손과 도구를 씻어주세요.\n\n새잎을 감싼 탁엽이 보여요\n큰 잎이 나오기 전에는 새잎을 감싼 뾰족한 구조가 눈에 띌 수 있어요. 이를 탁엽이라고 하며 잎과 함께 관찰하면 성장 과정을 이해하기 좋아요. 두껍고 가죽 같은 잎 표면, 선명한 중심 잎맥, 품종마다 다른 잎색도 관상 포인트예요. 무늬 품종과 녹색 품종의 모습은 서로 달라요. 새로 펼쳐지는 잎이 기존 잎과 다르다는 이유만으로 곧바로 병이나 영양 부족을 의심할 필요는 없어요.\n\n꽃은 우리가 아는 꽃 모양과 달라요\n무화과나무속은 작은 꽃들이 특수한 구조 안쪽에 자리하는 특징이 있어요. 장미처럼 크고 화려한 꽃잎을 보여주는 식물과는 달라요. 실내에서 꽃과 열매를 보는 일은 흔하지 않으므로 꽃이 피지 않는다고 실패한 관리라고 생각하지 마세요. 잎과 줄기의 생장, 현재의 수형을 감상하는 것이 실내 재배의 중심이에요. 번식에는 삽목이나 취목 같은 방법을 이용하며 각각 적절한 시기와 관리가 필요해요.\n\n두꺼운 잎이 있어도 뿌리는 숨을 쉬어야 해요\n잎이 두껍고 튼튼해 보여도 흙을 늘 젖게 유지하는 것이 좋은 관리는 아니에요. 겉흙과 안쪽 습기를 살펴 물을 주고 흘러나온 물은 비워주세요. 겨울에 성장이 둔해지면 흙도 더 천천히 마를 수 있어요. 잎에 먼지가 쌓였다면 부드러운 젖은 천으로 닦아 관찰하기 좋은 상태로 유지해주세요. 원산지 기후에 맞는 환경에서 가장 건강하게 자랍니다. 따뜻한 자리와 부드러운 빛을 기본으로 생각해주세요."
    },
